<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8fc">
<title>Quiz ICC Bruxelles</title>
<style>
:root{
  --bg:#f8f8fc;
  --surface:#fff;
  --surface2:#f6f4fb;
  --border:#e6e0f0;
  --text:#20192f;
  --muted:#655f7e;
  --faint:#8f89a8;
  --primary:#7c3aed;
  --primary2:#8b5cf6;
  --primary-dark:#5b21b6;
  --gold:#d97706;
  --success:#059669;
  --success-bg:rgba(16,185,129,.10);
  --error:#dc2626;
  --error-bg:rgba(239,68,68,.10);
  --shadow:0 20px 50px rgba(31,25,47,.08);
  --display:Georgia,'Times New Roman',serif;
  --body:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
html,body{margin:0;min-height:100%;font-family:var(--body);color:var(--text)}
body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(124,58,237,.08),transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 80%,rgba(245,158,11,.05),transparent 50%),
    linear-gradient(180deg,#fcfbff 0%,#f6f4fb 100%);
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.wrap{width:min(680px,calc(100% - 24px));margin:0 auto}
.app{min-height:100dvh;padding-bottom:82px}
main{padding:22px 0 30px}

/* Shared ICC identity */
.icc-logo{display:inline-flex;align-items:center;gap:12px}
.icc-logo img{
  width:46px;height:46px;object-fit:contain;border-radius:12px;background:#fff;
  box-shadow:0 5px 16px rgba(31,25,47,.08)
}
.icc-logo-copy{
  font-family:var(--display);font-size:1.14rem;line-height:1.06;text-align:left;font-weight:700
}
.icc-logo-copy span{
  display:block;font-family:var(--body);font-size:.66rem;color:var(--primary);
  letter-spacing:.12em;text-transform:uppercase;margin-top:4px;font-weight:800
}

/* Loader */
.loader{min-height:100dvh;display:grid;place-items:center}
.spinner{
  width:36px;height:36px;border:4px solid #e8e3f0;border-top-color:var(--primary);
  border-radius:50%;animation:spin .75s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login: deliberately only connection + ICC identity */
.login-page{min-height:100dvh;display:grid;place-items:center;padding:24px 14px}
.login-box{width:min(430px,100%);text-align:center}
.login-brand{display:flex;justify-content:center;margin-bottom:24px}
.login-card{
  background:var(--surface);border:1px solid var(--border);border-radius:26px;
  box-shadow:var(--shadow);padding:28px
}
.login-card h1{
  font-family:var(--display);font-size:clamp(1.65rem,6vw,2rem);line-height:1.15;margin:0 0 7px
}
.login-card .login-sub{color:var(--muted);font-size:.91rem;line-height:1.5;margin:0 0 22px}
.field{display:grid;gap:7px;text-align:left;margin:14px 0}
.field label{font-size:.82rem;color:var(--muted);font-weight:800}
.input,.select{
  width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:14px;
  background:var(--surface2);color:var(--text);outline:none
}
.input:focus,.select:focus{
  border-color:var(--primary2);box-shadow:0 0 0 3px rgba(124,58,237,.10)
}
.phone-row{display:grid;grid-template-columns:132px 1fr;gap:9px}
.small-note{font-size:.72rem;color:var(--faint);line-height:1.45}
.error-box{
  margin-top:12px;padding:11px 13px;background:var(--error-bg);color:#991b1b;
  border:1px solid rgba(220,38,38,.16);border-radius:12px;font-size:.8rem;text-align:left
}

/* Main header + nav */
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(252,251,255,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid rgba(230,224,240,.9)
}
.topbar-inner{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .icc-logo img{width:40px;height:40px}
.topbar .icc-logo-copy{font-size:1rem}
.topbar .icc-logo-copy span{font-size:.58rem}
.avatar-button{
  width:42px;height:42px;border-radius:50%;background:#f1ebff;color:var(--primary);
  display:grid;place-items:center;font-size:22px
}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)
}
.bottom-nav-inner{width:min(520px,100%);margin:auto;height:66px;display:grid;grid-template-columns:repeat(3,1fr)}
.nav-btn{
  background:transparent;color:#817a94;font-size:.69rem;font-weight:800;
  display:grid;place-items:center;align-content:center;gap:4px
}
.nav-btn span{font-size:20px;line-height:1}
.nav-btn.active{color:var(--primary)}

/* Cards & buttons */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  box-shadow:var(--shadow);padding:24px
}
.section-title{
  font-family:var(--display);font-size:1.35rem;margin:27px 2px 12px;line-height:1.15
}
.stack{display:grid;gap:12px}
.btn{
  border-radius:14px;font-weight:850;transition:.18s ease;
  padding:14px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 5px 18px rgba(124,58,237,.25)
}
.btn-green{background:var(--success);color:#fff}
.btn-soft{background:#f3edff;color:#6130c4}
.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:#fff1f2;color:#b4233a}
.btn-block{width:100%}
.tag{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;
  font-size:.7rem;font-weight:900;background:#f3edff;color:#6333c4;margin-bottom:9px
}
.tag.done{background:var(--success-bg);color:#067354}
.tag.started{background:#fff6df;color:#996200}
.empty{text-align:center;color:var(--muted);padding:25px 10px;line-height:1.5}

/* Home current quiz = old familiar start page, now inside the connected app */
.current-quiz-card{text-align:center;overflow:hidden}
.current-hero{
  width:160px;height:160px;margin:0 auto 19px;border-radius:50%;display:grid;place-items:center;
  overflow:hidden;background:#071d38;border:2px solid #e8d79a;
  box-shadow:0 0 0 6px rgba(255,255,255,.92),0 16px 38px rgba(7,29,56,.20),0 0 30px rgba(244,194,74,.24)
}
.current-hero img{width:100%;height:100%;object-fit:cover;display:block}
.current-title{
  font-family:var(--display);font-size:clamp(1.65rem,6vw,2.15rem);line-height:1.17;margin:0 0 8px
}
.current-pastor{font-weight:900;color:var(--primary);font-size:.9rem;margin-bottom:13px}
.current-desc{color:var(--muted);line-height:1.6;max-width:52ch;margin:0 auto 20px}
.current-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.stat{padding:13px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:14px}
.stat strong{display:block;font-family:var(--display);font-size:1.22rem;color:var(--primary);margin-bottom:3px}
.stat span{font-size:.61rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.current-result{
  margin:16px 0;padding:13px;border-radius:14px;background:#faf8ff;border:1px solid var(--border);
  font-weight:800
}
.home-welcome{font-size:.82rem;color:var(--muted);margin:0 2px 13px}
.previous-card{display:flex;gap:14px;align-items:center;justify-content:space-between}
.previous-copy{min-width:0}
.previous-card h3{font-size:.98rem;line-height:1.3;margin:0 0 5px}
.previous-card p{font-size:.76rem;color:var(--muted);margin:0}
.previous-score{font-size:.76rem;font-weight:850;color:#5c4779;margin-top:7px}

/* Quiz */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{
  width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--border);
  color:var(--text);font-weight:900
}
.progress-meta{flex:1}
.progress-meta strong{
  display:block;font-size:.72rem;color:var(--muted);font-weight:850;
  text-transform:uppercase;letter-spacing:.07em
}
.progress-track{height:6px;background:#e9e5f0;border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));
  transition:width .3s ease
}
.question-card{padding:27px}
.question-number{
  font-size:.72rem;font-weight:900;color:var(--primary);letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:9px
}
.preamble{
  margin:0 0 18px;padding:14px 16px;border-radius:16px;
  border:1px solid rgba(245,158,11,.20);
  background:linear-gradient(135deg,rgba(255,218,139,.18),rgba(255,255,255,.94));
  color:#7a4f00;line-height:1.55
}
.preamble-ref{
  display:block;font-size:.72rem;font-weight:900;letter-spacing:.07em;
  text-transform:uppercase;color:#a16207;margin-top:6px;font-style:normal
}
.preamble-text{font-family:var(--display);font-style:italic}
.question-prompt{
  font-family:var(--display);font-size:clamp(1.18rem,4vw,1.5rem);
  line-height:1.34;margin:0 0 16px
}
.helper{font-size:.84rem;color:var(--muted);line-height:1.5;margin:-5px 0 15px}
.options{display:grid;gap:10px}
.option{
  width:100%;display:flex;align-items:flex-start;gap:12px;padding:14px 15px;text-align:left;
  color:var(--text);background:var(--surface2);border:1.5px solid var(--border);
  border-radius:14px;transition:.16s ease
}
.option:hover:not(:disabled){border-color:var(--primary2);background:#f9f6ff}
.option.selected{border-color:var(--primary2);background:#f5f0ff}
.option.correct{border-color:var(--success);background:var(--success-bg)}
.option.wrong{border-color:var(--error);background:var(--error-bg)}
.option-letter{
  width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;
  background:#fff;border:1px solid var(--border);font-weight:900;color:var(--muted)
}
.option.selected .option-letter{background:var(--primary);border-color:var(--primary);color:#fff}
.text-answer{
  width:100%;padding:15px 16px;border:1.5px solid var(--border);border-radius:14px;
  background:var(--surface2);color:var(--text);outline:none
}
.text-answer:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(124,58,237,.09)}
.feedback{margin-top:17px;padding:15px 16px;border-radius:14px;line-height:1.58}
.feedback.good{background:var(--success-bg);border:1px solid rgba(5,150,105,.23);color:#065f46}
.feedback.bad{background:var(--error-bg);border:1px solid rgba(220,38,38,.20);color:#991b1b}
.feedback.personal{background:#f7f3ff;border:1px solid #ddd0f5;color:#4c3372}
.feedback h3{font-size:.98rem;margin:0 0 5px}
.feedback p{margin:7px 0}
.feedback-correct{font-weight:900}
.quiz-actions{margin-top:15px}
.video-list{display:grid;gap:10px;margin-top:14px}
.video-frame{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
  background:#000;margin-top:9px
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Result + trophy popup */
.result-card{text-align:center;padding:34px 24px}
.result-trophy{font-size:4.3rem;line-height:1}
.result-title{font-family:var(--display);font-size:2rem;margin:12px 0 5px}
.result-score{font-family:var(--display);font-size:3.5rem;color:var(--primary);font-weight:800;line-height:1;margin:18px 0 6px}
.result-percent{font-weight:900}
.result-points{
  display:inline-flex;margin-top:12px;border-radius:999px;padding:8px 13px;
  background:#f3edff;color:#6232c2;font-weight:900
}
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(22,15,31,.62);
  display:grid;place-items:center;padding:20px
}
.modal{
  width:min(390px,100%);background:#fff;border:1px solid var(--border);
  border-radius:28px;padding:28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:pop .22s ease-out
}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal-trophy{font-size:5rem;line-height:1}
.modal h2{font-family:var(--display);font-size:1.8rem;margin:10px 0 5px}
.modal p{color:var(--muted);line-height:1.5;margin:0 0 20px}

/* Leaderboard */
.page-title{font-family:var(--display);font-size:2rem;line-height:1.1;margin:0 0 5px}
.page-sub{color:var(--muted);font-size:.82rem;margin:0 0 17px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eee9f5;border-radius:14px;padding:4px;margin-bottom:13px}
.tab{background:transparent;padding:10px;border-radius:11px;color:#746b86;font-size:.82rem;font-weight:900}
.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(31,25,47,.08)}
.rank-list{padding:7px}
.rank-row{
  display:grid;grid-template-columns:42px 40px 1fr auto;gap:9px;align-items:center;
  padding:12px 9px;border-bottom:1px solid #eee9f4
}
.rank-row:last-child{border-bottom:0}
.rank-row.me{background:#f4efff;border-radius:14px;border-bottom:0;margin:3px 0}
.rank-no{text-align:center;font-weight:950}
.rank-avatar{text-align:center;font-size:22px}
.rank-name{font-weight:900;font-size:.88rem}
.rank-meta{font-size:.67rem;color:var(--muted);margin-top:2px}
.rank-points{font-weight:950;color:var(--primary);font-size:.83rem}

/* Account */
.profile-head{text-align:center}
.profile-avatar{
  width:82px;height:82px;border-radius:50%;display:grid;place-items:center;
  background:#f2ecff;font-size:40px;margin:0 auto 12px
}
.profile-head h2{font-family:var(--display);font-size:1.55rem;margin:0}
.profile-head p{margin:5px 0 0;color:var(--muted);font-size:.8rem}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:8px}
.avatar-choice{
  aspect-ratio:1;border:1.5px solid var(--border);border-radius:13px;background:#fff;
  display:grid;place-items:center;font-size:24px
}
.avatar-choice.selected{border-color:var(--primary2);background:#f4efff;box-shadow:0 0 0 3px rgba(124,58,237,.08)}

/* Review */
.review-summary{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:13px}
.review-summary-score{font-family:var(--display);font-size:1.65rem;font-weight:800;margin-top:4px}
.review-item{margin-bottom:12px}
.review-status{
  font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px
}
.review-status.good{color:#087455}
.review-status.bad{color:#b4233a}
.review-status.personal{color:#6533c2}
.review-item h3{font-family:var(--display);font-size:1.12rem;line-height:1.3;margin:0 0 8px}
.review-item>p{font-size:.88rem;line-height:1.5}
.review-answer{
  background:var(--surface2);border:1px solid var(--border);border-radius:13px;
  padding:11px 12px;margin:9px 0;font-size:.8rem;line-height:1.45
}
.review-explanation{font-size:.83rem;color:#504863;line-height:1.55;margin-top:10px}
.toast{
  position:fixed;left:50%;bottom:82px;z-index:150;transform:translateX(-50%);
  background:#20192f;color:#fff;padding:11px 15px;border-radius:13px;font-size:.78rem;
  box-shadow:var(--shadow);max-width:calc(100% - 28px);text-align:center
}

@media(max-width:560px){
  .login-page{padding:18px 10px}
  .login-card{padding:23px 16px;border-radius:22px}
  .phone-row{grid-template-columns:119px 1fr}
  .card{padding:20px 15px;border-radius:20px}
  .current-hero{width:142px;height:142px}
  .question-card{padding:20px 15px}
  .previous-card{align-items:flex-start;flex-direction:column}
  .previous-card .btn{width:100%}
  .rank-row{grid-template-columns:38px 36px 1fr auto;gap:7px;padding:11px 5px}
  .current-stats{gap:7px}
  .stat{padding:11px 5px}
  .stat strong{font-size:1.08rem}
  .stat span{font-size:.57rem}
}
</style>
</head>
<body>
<div id="root"><div class="loader"><div class="spinner"></div></div></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const ICC_LOGO = "/assets/icc-logo.png";
const DEFAULT_HERO = "/assets/quiz-globe.webp";

const AVATARS = {
  bible:"📖",
  dove:"🕊️",
  fire:"🔥",
  shield:"🛡️",
  sword:"⚔️",
  candle:"🕯️",
  wheat:"🌾",
  sheep:"🐑",
  crown:"👑",
  cross:"✝️"
};

const KNOWN_PASTORS = {
  "travail-de-fond-gagneur-ames-2026-09-06":"Pst. Christian Saboukoulou"
};

const state = {
  user:null,
  quizzes:null,
  quiz:null,
  attempt:null,
  currentQuestionIndex:0,
  currentAnswer:null,
  correction:null,
  result:null,
  selectedAvatar:"bible"
};

const root = document.getElementById("root");
const modalRoot = document.getElementById("modalRoot");
const toastRoot = document.getElementById("toastRoot");

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function avatarIcon(key){ return AVATARS[key] || AVATARS.bible; }

function trophyIcon(trophy){
  if(trophy==="gold") return "🏆";
  if(trophy==="silver") return "🥈";
  if(trophy==="bronze") return "🥉";
  return "🎯";
}

function trophyName(trophy){
  if(trophy==="gold") return "Or";
  if(trophy==="silver") return "Argent";
  if(trophy==="bronze") return "Bronze";
  return "Quiz terminé";
}

function formatDate(value){
  if(!value) return "";
  try{
    const d = /^\d{4}-\d{2}-\d{2}$/.test(value)
      ? new Date(value+"T12:00:00")
      : new Date(value);
    return new Intl.DateTimeFormat("fr-BE",{
      day:"numeric",month:"long",year:"numeric"
    }).format(d);
  }catch{
    return String(value);
  }
}

async function api(url,options={}){
  const response = await fetch(url,options);
  const text = await response.text();
  let body = null;
  try{
    body = text ? JSON.parse(text) : null;
  }catch{
    throw new Error("Le serveur a renvoyé une réponse inattendue.");
  }
  return {response,body};
}

function toast(message){
  toastRoot.innerHTML = `<div class="toast">${esc(message)}</div>`;
  window.setTimeout(()=>{toastRoot.innerHTML=""},2600);
}


/*
  QUIZ 100 % LOCAL PENDANT LES QUESTIONS
  ---------------------------------------
  - Les corrections sont déjà chargées au démarrage.
  - "Valider" ne fait AUCUN appel réseau.
  - "Suivant" ne fait AUCUN appel réseau.
  - Les réponses validées sont conservées dans localStorage.
  - À la fin seulement, les réponses sont envoyées en une seule fois
    au serveur, qui enregistre et calcule le score officiel.
*/

function normalizeQuizText(value){
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .toUpperCase();
}

function normalizeSet(value){
  const values = Array.isArray(value) ? value : [value];
  return [...new Set(
    values
      .map(v=>String(v ?? "").trim().toUpperCase())
      .filter(Boolean)
  )].sort();
}

function arraysEqual(a,b){
  return a.length===b.length && a.every((value,index)=>value===b[index]);
}

function buildLocalCorrection(question,answer){
  const evaluation = question?.evaluation;
  const mode = evaluation?.mode;

  if(mode==="exact_set"){
    const submitted = normalizeSet(answer);
    const correct = normalizeSet(evaluation.correct || []);
    return {
      questionId:question.id,
      submittedAnswer:answer,
      isCorrect:arraysEqual(submitted,correct),
      reflective:false,
      correctAnswer:evaluation.correct || [],
      explanation:question.explanation ?? null,
      reviewVideos:Array.isArray(question.reviewVideos) ? question.reviewVideos : []
    };
  }

  if(mode==="normalized_text"){
    const submitted = normalizeQuizText(answer);
    const accepted = Array.isArray(evaluation.accepted) ? evaluation.accepted : [];
    const normalizedAccepted = accepted.map(normalizeQuizText);
    return {
      questionId:question.id,
      submittedAnswer:answer,
      isCorrect:normalizedAccepted.includes(submitted),
      reflective:false,
      correctAnswer:accepted,
      explanation:question.explanation ?? null,
      reviewVideos:Array.isArray(question.reviewVideos) ? question.reviewVideos : []
    };
  }

  if(mode==="any_nonempty"){
    const isNonEmpty = Array.isArray(answer)
      ? answer.length>0
      : String(answer ?? "").trim().length>0;

    return {
      questionId:question.id,
      submittedAnswer:answer,
      isCorrect:isNonEmpty,
      reflective:true,
      correctAnswer:null,
      explanation:question.explanation ?? null,
      reviewVideos:Array.isArray(question.reviewVideos) ? question.reviewVideos : []
    };
  }

  return null;
}

function localAttemptStorageKey(){
  return state.attempt?.id
    ? `icc_quiz_local_${state.attempt.id}`
    : null;
}

function readLocalAttempt(){
  const key = localAttemptStorageKey();
  if(!key) return {answers:{}};

  try{
    const parsed = JSON.parse(localStorage.getItem(key) || "{}");
    return {
      answers:
        parsed && typeof parsed.answers==="object" && parsed.answers
          ? parsed.answers
          : {}
    };
  }catch{
    return {answers:{}};
  }
}

function readLocalAnswers(){
  return readLocalAttempt().answers;
}

function saveLocalAnswer(questionId,answer){
  const key = localAttemptStorageKey();
  if(!key) return;

  const data = readLocalAttempt();
  data.answers[questionId] = answer;

  localStorage.setItem(
    key,
    JSON.stringify({
      quizId:state.quiz?.id ?? null,
      answers:data.answers,
      updatedAt:new Date().toISOString()
    })
  );
}

function clearLocalAttempt(){
  const key = localAttemptStorageKey();
  if(key) localStorage.removeItem(key);
}

async function beginQuiz(quizId){
  setLoading();

  try{
    const started = await api("/api/attempts/start",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({quizId})
    });

    if(started.response.status===409 && started.body?.alreadyCompleted){
      state.result = started.body.result;
      showResult(false);
      return;
    }

    if(!started.response.ok){
      throw new Error(started.body?.error || "Impossible de démarrer le quiz.");
    }

    const play = await api(`/api/quiz/play?quizId=${encodeURIComponent(quizId)}`);

    if(play.response.status===409 && play.body?.alreadyCompleted){
      state.result = play.body.result;
      showResult(false);
      return;
    }

    if(!play.response.ok){
      throw new Error(play.body?.error || "Impossible de charger le quiz.");
    }

    state.quiz = play.body.quiz;
    state.attempt = play.body.attempt;
    state.currentAnswer = null;
    state.correction = null;

    const serverAnswered = play.body.attempt?.answeredQuestionIds || [];
    const localAnswered = Object.keys(readLocalAnswers());
    const answered = new Set([...serverAnswered,...localAnswered]);

    const questions = state.quiz?.questions || [];
    const firstUnanswered = questions.findIndex(q=>!answered.has(q.id));

    if(firstUnanswered===-1){
      await finishQuiz();
      return;
    }

    state.currentQuestionIndex = firstUnanswered;
    renderQuestion();
  }catch(e){
    toast(e.message);
    await showHome();
  }
}

function currentQuestion(){
  return state.quiz?.questions?.[state.currentQuestionIndex] || null;
}

function renderQuestion(){
  const q = currentQuestion();
  if(!q){
    showHome();
    return;
  }

  const total = state.quiz.questions.length;
  const number = state.currentQuestionIndex + 1;
  const progress = (number / total) * 100;
  const locked = !!state.correction;

  let preamble = "";
  if(q.preamble?.text){
    preamble = `
      <div class="preamble">
        <span class="preamble-text">${esc(q.preamble.text)}</span>
        ${q.preamble.reference?`<span class="preamble-ref">${esc(q.preamble.reference)}</span>`:""}
      </div>`;
  }

  let answerHtml = "";

  if(q.type==="text"){
    const value = typeof state.currentAnswer==="string" ? state.currentAnswer : "";
    answerHtml = `
      <input id="textAnswer" class="text-answer" ${locked?"disabled":""}
        value="${esc(value)}" placeholder="Ta réponse…" oninput="state.currentAnswer=this.value">`;
  }else{
    const isMulti = q.type==="multi_select" || q.type==="multi_select_reflective";
    const selected = Array.isArray(state.currentAnswer) ? state.currentAnswer : [];

    answerHtml = `
      <div class="options">
        ${(q.options || []).map(opt=>{
          const chosen = selected.includes(opt.id);
          let klass = chosen ? " selected" : "";

          if(locked){
            const c = state.correction;
            if(!c.reflective){
              const correctSet = Array.isArray(c.correctAnswer)
                ? c.correctAnswer
                : [c.correctAnswer];

              if(correctSet.includes(opt.id)) klass += " correct";
              else if(chosen) klass += " wrong";
            }
          }

          return `
            <button class="option${klass}" ${locked?"disabled":""}
              onclick="chooseOption('${esc(opt.id)}',${isMulti})">
              <span class="option-letter">${esc(opt.id)}</span>
              <span>${esc(opt.text)}</span>
            </button>`;
        }).join("")}
      </div>`;
  }

  let feedbackHtml = "";

  if(state.correction){
    const c = state.correction;
    const cls = c.reflective ? "personal" : (c.isCorrect ? "good" : "bad");
    const heading = c.reflective ? "Réponse enregistrée" : (c.isCorrect ? "Bonne réponse !" : "À revoir");

    let correctLine = "";
    if(!c.reflective && c.correctAnswer != null){
      const ids = Array.isArray(c.correctAnswer) ? c.correctAnswer : [c.correctAnswer];
      const readable = ids.map(id=>{
        const option = (q.options || []).find(x=>x.id===id);
        return option ? `${id}. ${option.text}` : id;
      }).join(" · ");

      correctLine = `<p class="feedback-correct">Bonne réponse : ${esc(readable)}</p>`;
    }

    const videos = Array.isArray(c.reviewVideos) && c.reviewVideos.length
      ? `
        <div class="video-list">
          ${c.reviewVideos.map((video,index)=>`
            <div>
              <button class="btn btn-ghost btn-block"
                onclick="openVideo('${esc(video.videoId)}',${Number(video.start)||0},${Number(video.end)||0},'quizVideo${index}')">
                ${esc(video.buttonText || "🎬 "+(video.label || "Revoir l’extrait"))}
              </button>
              <div id="quizVideo${index}"></div>
            </div>
          `).join("")}
        </div>`
      : "";

    feedbackHtml = `
      <div class="feedback ${cls}">
        <h3>${heading}</h3>
        ${correctLine}
        ${c.explanation?`<p>${esc(c.explanation)}</p>`:""}
        ${videos}
      </div>`;
  }

  root.innerHTML = `
    <div class="app" style="padding-bottom:20px">
      ${topbar()}
      <main>
        <div class="wrap">
          <div class="quiz-top">
            <button class="back" onclick="showHome()" aria-label="Retour">←</button>
            <div class="progress-meta">
              <strong>Question ${number} / ${total}</strong>
              <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>
          </div>

          <div class="card question-card">
            <div class="question-number">${esc(q.title || `Question ${number}`)}</div>
            ${preamble}
            <h2 class="question-prompt">${esc(q.prompt)}</h2>
            ${q.helper?`<div class="helper">${esc(q.helper)}</div>`:""}
            ${answerHtml}
            ${feedbackHtml}

            <div class="quiz-actions">
              ${locked
                ? `<button class="btn btn-green btn-block" onclick="nextQuestion()">${number===total?"Voir mon résultat":"Suivant"} →</button>`
                : `<button id="validateButton" class="btn btn-primary btn-block" onclick="submitAnswer()">Valider</button>`
              }
            </div>
          </div>
        </div>
      </main>
    </div>`;
}

function chooseOption(id,isMulti){
  if(state.correction) return;

  if(isMulti){
    const answer = Array.isArray(state.currentAnswer) ? [...state.currentAnswer] : [];
    const index = answer.indexOf(id);
    if(index>=0) answer.splice(index,1);
    else answer.push(id);
    state.currentAnswer = answer;
  }else{
    state.currentAnswer = [id];
  }

  renderQuestion();
}

async function submitAnswer(){
  const q = currentQuestion();
  if(!q) return;

  if(q.type==="text"){
    state.currentAnswer = document.getElementById("textAnswer")?.value ?? "";
  }

  const empty = Array.isArray(state.currentAnswer)
    ? state.currentAnswer.length===0
    : !String(state.currentAnswer ?? "").trim();

  if(empty){
    toast("Choisis une réponse avant de valider.");
    return;
  }

  /*
    Cas normal : la correction est déjà disponible localement.
    Aucun appel réseau n'est attendu avant de l'afficher.
  */
  const localCorrection = buildLocalCorrection(q,state.currentAnswer);

  if(localCorrection){
    /*
      On conserve la réponse sur l'appareil AVANT d'afficher
      la correction. Aucun appel serveur n'est lancé ici.
    */
    saveLocalAnswer(q.id,state.currentAnswer);

    state.correction = localCorrection;
    renderQuestion();
    return;
  }

  /*
    Garde-fou pour un futur type de question que cette version
    du navigateur ne connaîtrait pas encore : on repasse alors
    sur l'ancienne validation serveur.
  */
  const button = document.getElementById("validateButton");
  if(button){
    button.disabled = true;
    button.textContent = "Validation…";
  }

  try{
    const {response,body} = await api("/api/attempts/answer",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        quizId:state.quiz.id,
        questionId:q.id,
        answer:state.currentAnswer
      })
    });

    if(!response.ok){
      throw new Error(body?.error || "Impossible d'enregistrer la réponse.");
    }

    state.currentAnswer = body.correction?.submittedAnswer ?? state.currentAnswer;
    state.correction = body.correction;
    renderQuestion();
  }catch(e){
    if(button){
      button.disabled = false;
      button.textContent = "Valider";
    }
    toast(e.message);
  }
}
async function nextQuestion(){
  if(state.currentQuestionIndex >= state.quiz.questions.length - 1){
    await finishQuiz();
    return;
  }

  state.currentQuestionIndex++;
  state.currentAnswer = null;
  state.correction = null;
  renderQuestion();
}

async function finishQuiz(){
  showCalculatingResult();

  try{
    const answers = readLocalAnswers();

    const {response,body} = await api("/api/attempts/finish",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        quizId:state.quiz.id,
        answers
      })
    });

    if(response.status===409 && body?.alreadyCompleted){
      clearLocalAttempt();
      state.result = body.result;
      showResult(false);
      return;
    }

    if(response.status===400 && body?.incomplete){
      toast("Certaines réponses manquent encore.");
      await beginQuiz(state.quiz.id);
      return;
    }

    if(!response.ok){
      throw new Error(body?.error || "Impossible de calculer ton résultat.");
    }

    clearLocalAttempt();
    state.result = body.result;
    showResult(true);
  }catch(e){
    console.error("Finish quiz error:",e);
    showSyncRetry();
  }
}
function showResult(showPopup=true){
  const r = state.result;
  if(!r){
    showHome();
    return;
  }

  root.innerHTML = shell(`
    <div class="card result-card">
      <div class="result-trophy">${trophyIcon(r.trophy)}</div>
      <h1 class="result-title">${esc(trophyName(r.trophy))}</h1>
      <div class="result-score">${esc(r.score)} <span style="font-size:.4em;color:var(--muted)">/ ${esc(r.maxScore)}</span></div>
      <div class="result-percent">${esc(r.percentage)} %</div>
      <div class="result-points">+${esc(r.points)} point${Number(r.points)===1?"":"s"}</div>
    </div>
  `,"rank");

  if(showPopup){
    showTrophyPopup(r);
  }
}

async function showLeaderboard(type="weekly"){

  try{
    const {response,body} = await api(`/api/leaderboard?type=${encodeURIComponent(type)}`);

    if(response.status===401){
      showLogin();
      return;
    }

    if(!response.ok){
      throw new Error(body?.error || "Impossible de charger le classement.");
    }

    const rows = Array.isArray(body.leaderboard) ? body.leaderboard : [];

    const rankingHtml = rows.length
      ? rows.map(player=>`
          <div class="rank-row ${player.isCurrentUser?"me":""}">
            <div class="rank-no">${player.rank===1?"🥇":player.rank===2?"🥈":player.rank===3?"🥉":"#"+player.rank}</div>
            <div class="rank-avatar">${avatarIcon(player.avatar)}</div>
            <div>
              <div class="rank-name">${esc(player.displayName)}${player.isCurrentUser?" · toi":""}</div>
              <div class="rank-meta">🏆 ${player.gold || 0} · 🥈 ${player.silver || 0} · 🥉 ${player.bronze || 0}</div>
            </div>
            <div class="rank-points">${esc(player.points)} pts</div>
          </div>
        `).join("")
      : `<div class="empty">Le classement est encore vide.</div>`;

    root.innerHTML = shell(`
      <h1 class="page-title">Classement 🏆</h1>
      <p class="page-sub">ICC Bruxelles</p>

      <div class="tabs">
        <button class="tab ${type==="weekly"?"active":""}" onclick="showLeaderboard('weekly')">Cette semaine</button>
        <button class="tab ${type==="general"?"active":""}" onclick="showLeaderboard('general')">Général</button>
      </div>

      <div class="card rank-list">${rankingHtml}</div>
    `,"rank");
  }catch(e){
    root.innerHTML = shell(`<div class="card empty">${esc(e.message)}</div>`,"rank");
  }
}

async function reviewQuiz(quizId){
  setLoading();

  try{
    const {response,body} = await api(`/api/quiz/review?quizId=${encodeURIComponent(quizId)}`);

    if(!response.ok){
      throw new Error(body?.error || "Impossible de charger tes réponses.");
    }

    const questions = Array.isArray(body.questions) ? body.questions : [];

    const reviewHtml = questions.map((q,index)=>{
      const statusClass = q.reflective ? "personal" : (q.isCorrect ? "good" : "bad");
      const statusText = q.reflective ? "Réponse personnelle" : (q.isCorrect ? "Correct" : "Incorrect");
      const optionMap = Object.fromEntries((q.options || []).map(o=>[o.id,o.text]));

      const formatAnswer = value=>{
        if(value==null) return "—";
        const values = Array.isArray(value) ? value : [value];
        return values.map(v=>optionMap[v] ? `${v}. ${optionMap[v]}` : v).join(" · ");
      };

      const correctBlock = q.reflective
        ? ""
        : `<div class="review-answer"><strong>Bonne réponse :</strong><br>${esc(formatAnswer(q.correctAnswer))}</div>`;

      const videoBlock = Array.isArray(q.reviewVideos) && q.reviewVideos.length
        ? `
          <div class="video-list">
            ${q.reviewVideos.map((video,videoIndex)=>`
              <div>
                <button class="btn btn-ghost btn-block"
                  onclick="openVideo('${esc(video.videoId)}',${Number(video.start)||0},${Number(video.end)||0},'reviewVideo${index}_${videoIndex}')">
                  ${esc(video.buttonText || "🎬 "+(video.label || "Revoir l’extrait"))}
                </button>
                <div id="reviewVideo${index}_${videoIndex}"></div>
              </div>
            `).join("")}
          </div>`
        : "";

      return `
        <div class="card review-item">
          <div class="review-status ${statusClass}">${statusText}</div>
          <h3>${esc(q.title || `Question ${index+1}`)}</h3>

          ${q.preamble?.text?`
            <div class="preamble">
              <span class="preamble-text">${esc(q.preamble.text)}</span>
              ${q.preamble.reference?`<span class="preamble-ref">${esc(q.preamble.reference)}</span>`:""}
            </div>`:""}

          <p>${esc(q.prompt)}</p>
          <div class="review-answer"><strong>Ta réponse :</strong><br>${esc(formatAnswer(q.submittedAnswer))}</div>
          ${correctBlock}
          ${q.explanation?`<div class="review-explanation">${esc(q.explanation)}</div>`:""}
          ${videoBlock}
        </div>`;
    }).join("");

    root.innerHTML = `
      <div class="app">
        ${topbar()}
        <main>
          <div class="wrap">
            <div class="quiz-top">
              <button class="back" onclick="showHome()" aria-label="Retour">←</button>
              <div class="progress-meta"><strong>Quiz précédent</strong></div>
            </div>

            <div class="card review-summary">
              <div>
                <div class="small-note">${esc(body.quiz?.title || "")}</div>
                <div class="review-summary-score">${esc(body.result?.score)}/${esc(body.result?.maxScore)} · ${esc(body.result?.percentage)} %</div>
              </div>
              <div style="font-size:44px">${trophyIcon(body.result?.trophy)}</div>
            </div>

            ${reviewHtml}
          </div>
        </main>
        ${nav("home")}
      </div>`;
  }catch(e){
    toast(e.message);
    await showHome();
  }
}

function openVideo(videoId,start,end,targetId){
  const target = document.getElementById(targetId);
  if(!target) return;

  if(target.innerHTML){
    target.innerHTML = "";
    return;
  }

  const s = Math.max(0,Number(start)||0);
  const e = Math.max(0,Number(end)||0);
  const endParam = e>s ? `&end=${e}` : "";

  target.innerHTML = `
    <div class="video-frame">
      <iframe
        src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?start=${s}${endParam}&autoplay=1&rel=0"
        title="Extrait vidéo"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>`;
}

function showAccount(){
  if(!state.user){
    showLogin();
    return;
  }

  state.selectedAvatar = state.user.avatar || "bible";

  root.innerHTML = shell(`
    <div class="card profile-head">
      <div class="profile-avatar">${avatarIcon(state.user.avatar)}</div>
      <h2>${esc(state.user.displayName)}</h2>
      <p>${esc(state.user.unit?.name || "ICC Bruxelles")}</p>
    </div>

    <h2 class="section-title">Mon profil</h2>
    <div class="card">
      <div class="field">
        <label for="profileName">Nom affiché</label>
        <input id="profileName" class="input" maxlength="30" value="${esc(state.user.displayName)}">
      </div>

      <div class="field">
        <label>Icône de profil</label>
        <div class="avatar-grid">
          ${Object.entries(AVATARS).map(([key,icon])=>`
            <button class="avatar-choice ${key===state.selectedAvatar?"selected":""}" onclick="selectAvatar('${key}')">${icon}</button>
          `).join("")}
        </div>
      </div>

      <button id="saveProfileButton" class="btn btn-primary btn-block" onclick="saveProfile()">Enregistrer les modifications</button>
    </div>

    <h2 class="section-title">Session</h2>
    <div class="card">
      <button class="btn btn-danger btn-block" onclick="logout()">Se déconnecter</button>
    </div>
  `,"account");
}

function selectAvatar(key){
  state.selectedAvatar = key;
  const keys = Object.keys(AVATARS);
  document.querySelectorAll(".avatar-choice").forEach((button,index)=>{
    button.classList.toggle("selected",keys[index]===key);
  });
}

async function saveProfile(){
  const displayName = document.getElementById("profileName")?.value.trim();
  const button = document.getElementById("saveProfileButton");

  button.disabled = true;
  button.textContent = "Enregistrement…";

  try{
    const {response,body} = await api("/api/profile",{
      method:"PATCH",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        displayName,
        avatar:state.selectedAvatar
      })
    });

    if(!response.ok){
      throw new Error(body?.error || "Modification impossible.");
    }

    state.user.displayName = body.user.displayName;
    state.user.avatar = body.user.avatar;
    toast("Profil mis à jour.");
    showAccount();
  }catch(e){
    button.disabled = false;
    button.textContent = "Enregistrer les modifications";
    toast(e.message);
  }
}

async function logout(){
  try{
    await api("/api/logout",{method:"POST"});
  }catch{}

  state.user = null;
  state.quizzes = null;
  state.quiz = null;
  state.attempt = null;
  state.result = null;
  modalRoot.innerHTML = "";
  showLogin();
}

window.addEventListener("DOMContentLoaded",loadApp);
</script>
</body>
</html>
